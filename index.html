<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Productivity Starter</title>
<meta name="description" content="Time journal: track study, work, workouts and rest, plan tasks and keep a streak.">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<script>/* look: "luxe" (default) or "classic"; set before the page paints */try{document.documentElement.dataset.skin=localStorage.getItem("ps-skin")||"luxe"}catch(e){document.documentElement.dataset.skin="luxe"}</script>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Productivity">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Manrope:wght@400;500;600;700&display=swap">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <button class="iconbtn menubtn" id="menuBtn" type="button" data-open="drawer" data-ta="menu"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div>
      <div class="titlerow"><h1>Productivity Starter</h1><span class="beta" id="verBadge">Beta</span></div>
      <div class="sub" data-t="sub"></div>
      </div>
    </div>
    <div class="hdr-r">
      <div class="daynav">
        <button class="iconbtn" id="prev" data-ta="prevDay">‹</button>
        <div class="d" id="dayLabel">—</div>
        <button class="iconbtn" id="next" data-ta="nextDay">›</button>
        <button class="chipbtn" id="today" data-t="today"></button>
      </div>


      <button class="acctbtn" id="acctBtn" type="button">…</button>

    </div>
  </header>

  <div class="topgrid">
    <section class="panel" data-ta="calendar">
      <div class="calhead">
        <button class="iconbtn" id="mPrev" data-ta="prevMonth">‹</button>
        <div class="m" id="mLabel">—</div>
        <button class="iconbtn" id="mNext" data-ta="nextMonth">›</button>
      </div>
      <div class="calgrid" id="cal"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel" aria-labelledby="sumH">
      <div class="panel-head"><h2 id="sumH" data-t="daySummary"></h2><span class="status" id="status"></span></div>
      <div class="streak" id="streak"></div>
      <div class="total">
        <div>
          <div class="label" data-t="totalLogged"></div>
          <div class="big" id="totalBig">0</div>
        </div>
        <div class="ratio"><span id="ratio"></span><span class="dayinc" id="dayIncome"></span></div>
      </div>
      <div class="strip" id="strip"></div>
      <div class="cats" id="cats"></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="planH">
    <div class="panel-head"><h2 id="planH" data-t="plan"></h2><span class="hint" data-t="planHint"></span></div>
    <div class="plan">
      <div>
        <h3><span data-t="tasks"></span><span class="prog" id="taskProg"></span></h3>
        <ul class="tasks" id="tasks"></ul>
        <div class="row">
          <input type="text" id="taskIn" class="grow" data-tp="taskPh">
          <button class="primary" id="taskAdd" data-t="add"></button>
        </div>
      </div>
      <div>
        <h3><span data-t="notes"></span><span class="prog" id="noteSaved"></span></h3>
        <textarea id="noteArea" data-tp="notesPh"></textarea>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="addH">
    <div class="panel-head"><h2 id="addH" data-t="logTime"></h2><span class="hint" id="addFor"></span></div>
    <div class="logger">
      <div>
        <div class="seg" id="seg" role="group"></div>
        <div class="field">
          <div class="mode tmode" role="group">
            <button type="button" data-tm="range" id="tm-range" data-t="tmRange"></button>
            <button type="button" data-tm="dur" id="tm-dur" data-t="tmDur"></button>
          </div>
          <div id="rangeBox" class="tbox">
            <div class="tiles range">
              <button type="button" class="tile big" id="rStartTile"><span class="tlab" data-t="rStartL"></span><span class="tv" id="rStartVal"></span><svg class="caret" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <span class="arrow" aria-hidden="true">→</span>
              <button type="button" class="tile big" id="rEndTile"><span class="tlab" data-t="rEndL"></span><span class="tv" id="rEndVal"></span><svg class="caret" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <div class="rangesum" id="rangeSum"></div>
          </div>
          <div id="durBox" class="tbox" hidden>
            <div class="tiles">
              <button type="button" class="tile big" id="durTile"><span class="tlab" data-t="durL"></span><span class="tv" id="durVal"></span><svg class="caret" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <button type="button" class="tile" id="startTile"><span class="tlab" data-t="startedAt"></span><span class="tv" id="startVal"></span><svg class="caret" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <div class="durs" id="durs"></div>
          </div>
          <input type="hidden" id="startIn"><input type="hidden" id="rStart"><input type="hidden" id="rEnd">
          <div class="payrow" id="payRow" hidden>
            <span class="label" data-t="payLabel"></span>
            <div class="mode" role="group">
              <button type="button" data-pm="sum" id="pm-sum" data-t="pmSum"></button>
              <button type="button" data-pm="rate" id="pm-rate" data-t="pmRate"></button>
            </div>
            <label class="money"><span>$</span><input type="text" id="payIn" inputmode="decimal" class="mono"></label>
            <span class="paycalc" id="payCalc"></span>
          </div>
          <div class="row">
            <label class="inp grow"><span data-t="note"></span><input type="text" id="noteIn" data-tp="notePh"></label>
          </div>
          <div class="preview" id="preview" aria-live="polite"></div>
          <div class="editbar" id="editBar" hidden><span id="editTxt"></span><button type="button" class="ghost" id="editCancel" data-t="cancel"></button></div>
          <button class="primary addbig" id="addBtn" data-t="add"></button>
          <div class="msg" id="msg"></div>
        </div>
      </div>
      <div class="timer" id="timer"></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="logH">
    <div class="panel-head"><h2 id="logH" data-t="journal"></h2><span class="hint" id="logCount"></span></div>
    <ul class="log" id="log"></ul>
  </section>

  <section class="panel" aria-labelledby="wkH">
    <div class="panel-head"><h2 id="wkH" data-t="week"></h2><span class="wkhead"><span class="weeknav"><button type="button" class="iconbtn wkarrow" data-wk="-1" data-ta="prevWeek">‹</button><span class="hint mono wkrange" id="wkRange"></span><button type="button" class="iconbtn wkarrow" data-wk="1" data-ta="nextWeek">›</button></span><button type="button" class="chipbtn thiswk" id="thisWeek" data-t="thisWeek" hidden></button><button type="button" class="chipbtn detailsbtn" data-open="pg-week"><span data-t="detailsBtn"></span> ›</button></span></div>
    <div class="week">
      <div class="chart" id="chart"></div>
      <div class="wk-tot" id="wkTot"></div>
    </div>
  </section>





  <section class="panel migrate" id="migrateBox" hidden>
    <p id="migrateText"></p>
    <button class="primary" id="migrateBtn" data-t="migrateBtn"></button>
    <div class="datamsg" id="dataMsg"></div>
  </section>


</div>

<footer class="foot">

  <div><span id="footVer"></span> · <a href="https://github.com/DZonLive/Daily_Tracker" target="_blank" rel="noopener">GitHub</a></div>
</footer>

<button type="button" class="fabmenu" id="fabMenu" data-open="drawer" data-ta="menu" tabindex="-1"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>

<div class="updatebar" id="updateBar" hidden role="status">
  <span data-t="updateText"></span>
  <button class="primary" id="updateBtn" data-t="updateBtn"></button>
</div>

<dialog id="acct" aria-labelledby="acctTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="acctTitle" data-t="account"></h2><button class="del" id="acctClose" data-ta="close">×</button></div>
    <div id="acctOut">
      <p class="lead" data-t="signInLead"></p>
      <div id="acctUnavailable" hidden class="datamsg err" data-t="acctUnavailable"></div>
      <div id="acctForm" class="acctform">
        <button class="google" id="gBtn" type="button"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span data-t="google"></span></button>
        <div class="or"><span data-t="orEmail"></span></div>
        <label class="inp"><span data-t="email"></span><input type="email" id="acctEmail" autocomplete="email" inputmode="email"></label>
        <label class="inp"><span data-t="password"></span><input type="password" id="acctPass" autocomplete="current-password" minlength="6"></label>
        <div class="row">
          <button class="primary" id="emailIn" data-t="signInBtn"></button>
          <button class="ghost" id="emailUp" data-t="signUpBtn"></button>
        </div>
        <button class="linkbtn" id="resetBtn" data-t="forgot"></button>
      </div>
    </div>
    <div id="acctIn" hidden>
      <p class="lead"><span data-t="signedInAs"></span> <b id="acctWho"></b></p>
      <p class="hint" data-t="syncOn"></p>
      <button class="ghost" id="signOutBtn" data-t="signOut"></button>
    </div>
    <div class="datamsg" id="acctMsg"></div>
  </div>
</dialog>

<dialog id="installDlg" class="sheet" aria-labelledby="instTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="instTitle" data-t="instTitle"></h2><button class="del" id="instClose" data-ta="close">×</button></div>
    <p class="lead" data-t="instLead"></p>
    <div class="inst-main" id="instMain"></div>
    <details class="inst-more">
      <summary data-t="instOther"></summary>
      <div id="instAll"></div>
    </details>
  </div>
</dialog>

<dialog id="shareDlg" class="sheet" aria-labelledby="shareTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="shareTitle" data-t="shareTitle"></h2><button class="del" id="shareClose" data-ta="close">×</button></div>
    <p class="lead" data-t="shareLead"></p>
    <div class="row">
      <input type="text" id="shareUrl" class="grow mono" readonly aria-label="Link">
      <button class="primary" id="shareCopy" data-t="copyLink"></button>
    </div>
    <div class="datamsg ok" id="shareCopied"></div>
  </div>
</dialog>

<dialog id="wheelDlg" class="wheeldlg" aria-labelledby="wheelTitle">
  <div class="wsheet">
    <div class="whead">
      <button type="button" class="linkbtn" id="wCancel" data-t="cancel"></button>
      <div class="wtitle"><div id="wheelTitle"></div><div class="wnow mono" id="wheelValue"></div></div>
      <button type="button" class="primary wdone" id="wDone" data-t="done"></button>
    </div>
    <div class="wcols" id="wheelCols"></div>
    <div class="wextra" id="wheelExtra"></div>
  </div>
</dialog>

<dialog id="colorDlg" class="sheet" aria-labelledby="colTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="colTitle" data-t="colorsTitle"></h2><button class="del" id="colClose" data-ta="close">×</button></div>
    <div class="label" data-t="colorsMain"></div>
    <div class="swatches" id="colPresets"></div>
    <div class="label" data-t="colorsMore"></div>
    <div class="swatches" id="colExtra"></div>
    <div class="label" data-t="colorsCustom"></div>
    <div class="row customcol"><input type="color" id="colCustom" aria-label="color"><button class="primary" id="colUse" data-t="useColor"></button></div>
  </div>
</dialog>

<dialog class="drawer" id="drawer" aria-labelledby="drawerTitle">
  <div class="drawerhead"><div><div class="dtitle" id="drawerTitle">Productivity Starter</div><div class="hint" id="drawerVer"></div></div><button type="button" class="iconbtn" data-close data-ta="close">×</button></div>
  <nav class="menu">
    <button type="button" class="mitem" data-open="pg-cats"><span class="mic">◎</span><span class="mtx"><b data-t="menuCats"></b><small data-t="menuCatsSub"></small></span><span class="chev" aria-hidden="true">›</span></button>
    <button type="button" class="mitem" data-open="pg-income"><span class="mic">$</span><span class="mtx"><b data-t="income"></b><small data-t="menuIncomeSub"></small></span><span class="chev" aria-hidden="true">›</span></button>
    <button type="button" class="mitem" data-open="pg-week"><span class="mic">▦</span><span class="mtx"><b data-t="weekDetail"></b><small data-t="menuWeekSub"></small></span><span class="chev" aria-hidden="true">›</span></button>
    <button type="button" class="mitem" data-open="pg-settings"><span class="mic">⚙</span><span class="mtx"><b data-t="menuSettings"></b><small data-t="menuSettingsSub"></small></span><span class="chev" aria-hidden="true">›</span></button>
  </nav>
  <div class="menu2">
  <button class="mitem2 installbtn" id="installBtn" type="button"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl-long" data-t="install"></span><span class="lbl-short" data-t="installShort"></span></button>
  <button class="mitem2 sharebtn" id="shareBtn" type="button" data-ta="share"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="share"></span></button>
    <button type="button" class="mitem2" data-act="acct"><span class="mic2">●</span><span data-t="account"></span></button>
  </div>
  <div class="drawerfoot"><a href="https://github.com/DZonLive/Daily_Tracker" target="_blank" rel="noopener">GitHub</a></div>
</dialog>
<dialog class="page" id="pg-cats">
  <div class="pagebar"><button type="button" class="iconbtn" data-close data-ta="back">←</button><h2 class="pagetitle" data-t="catsGoals"></h2></div>
  <div class="pagebody">
  <section class="panel" id="catsPanel" aria-labelledby="cgH">
    <div class="panel-head"><h2 id="cgH" data-t="catsGoals"></h2>
      <div class="mode" role="group">
        <button type="button" data-mode="week" id="mode-week" data-t="perWeek"></button>
        <button type="button" data-mode="day" id="mode-day" data-t="perDay"></button>
      </div>
    </div>
    <p class="hint" id="goalHint" style="margin:0"></p>
    <p class="hint cathelp" data-t="catHelp"></p>
    <div class="catlist" id="catlist"></div>

    <div class="newcat">
      <span class="label" data-t="newCat"></span>
      <div class="row">
        <input type="text" id="ncName" class="grow" data-tp="namePh" maxlength="24">
        <label class="chk"><input type="checkbox" id="ncProd" checked><span data-t="prodLabel"></span></label>
        <button class="primary" id="ncAdd" data-t="add"></button>
      </div>
      <div class="swatches" id="ncSw"></div>
    </div>
  </section>
  </div>
</dialog>
<dialog class="page" id="pg-income">
  <div class="pagebar"><button type="button" class="iconbtn" data-close data-ta="back">←</button><h2 class="pagetitle" data-t="income"></h2></div>
  <div class="pagebody">
  <section class="panel" id="incomePanel" aria-labelledby="incH">
    <div class="panel-head"><h2 id="incH" data-t="income"></h2>
      <div class="wdtools">
        <button class="iconbtn" id="iPrev" data-ta="prevMonth">‹</button>
        <span class="hint mono" id="incMonth" style="min-width:130px;text-align:center"></span>
        <button class="iconbtn" id="iNext" data-ta="nextMonth">›</button>
      </div>
    </div>
    <div class="inc-top">
      <div class="inc-big">
        <div class="label" data-t="incMonthTotal"></div>
        <div class="big mono" id="incMonthTotal">$0</div>
        <div id="incGoalBox"></div>
      </div>
      <div class="inc-stats" id="incStats"></div>
    </div>
    <div class="mchart" id="mchart"></div>
    <p class="hint inc-how" id="incHow"></p>
    <div class="inc-legacy" id="incLegacy" hidden>
      <h3><span data-t="legacyTitle"></span></h3>
      <ul class="tasks inclist" id="incList"></ul>
    </div>
    <div class="streakset">
      <label for="incGoal" data-t="incGoal"></label>
      <label class="money small-money"><span>$</span><input type="number" id="incGoal" min="0" step="50" class="mono"></label>
      <button type="button" class="goalclr" id="incGoalClr" data-ta="removeGoal" hidden>×</button>
      <span class="hint" data-t="goalHint"></span>
    </div>
  </section>
  </div>
</dialog>
<dialog class="page" id="pg-week">
  <div class="pagebar"><button type="button" class="iconbtn" data-close data-ta="back">←</button><h2 class="pagetitle" data-t="weekDetail"></h2></div>
  <div class="pagebody">
  <section class="panel" aria-labelledby="wdH">
    <div class="panel-head"><h2 id="wdH" data-t="weekDetail"></h2>
      <div class="wdtools">
        <button class="iconbtn" id="wPrev" data-ta="prevWeek">‹</button>
        <span class="hint mono" id="wdRange" style="min-width:150px;text-align:center"></span>
        <button class="iconbtn" id="wNext" data-ta="nextWeek">›</button>
        <div class="mode" role="group">
          <button type="button" data-wdr="auto" id="wdr-auto" data-t="rangeAuto"></button>
          <button type="button" data-wdr="full" id="wdr-full">0–24</button>
        </div>
      </div>
    </div>
    <div class="wdscroll"><div class="wd" id="wd"></div></div>
    <div class="wdnote" id="wdnote"></div>
    <details class="wtable" id="wtable">
      <summary data-t="showTable"></summary>
      <div class="tblwrap"><table class="wt" id="wt"></table></div>
    </details>
  </section>
  </div>
</dialog>
<dialog class="page" id="pg-settings">
  <div class="pagebar"><button type="button" class="iconbtn" data-close data-ta="back">←</button><h2 class="pagetitle" data-t="menuSettings"></h2></div>
  <div class="pagebody">
  <section class="panel">
    <div class="setrow"><span class="setlabel" data-t="setLang"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" id="lang-en">EN</button>
        <button type="button" data-lang="ru" id="lang-ru">RU</button>
      </div>
    </div>
    <div class="setrow"><span class="setlabel" data-t="lookLabel"></span>
      <div class="mode"><button type="button" data-skin="luxe" id="skin-luxe" data-t="lookLuxe"></button><button type="button" data-skin="classic" id="skin-classic" data-t="lookClassic"></button></div>
    </div>
    <div class="setrow"><span class="setlabel" data-t="timeFmt"></span>
      <div class="mode"><button type="button" data-clock="24" id="clk-24" data-t="use24"></button><button type="button" data-clock="12" id="clk-12" data-t="use12"></button></div>
    </div>
    <div class="setrow col"><span class="setlabel">Streak</span>
      <div class="mode" role="group">
        <button type="button" data-smode="week" id="sm-week" data-t="smWeek"></button>
        <button type="button" data-smode="day" id="sm-day" data-t="smDay"></button>
        <button type="button" data-smode="off" id="sm-off" data-t="smOff"></button>
      </div>
      <p class="hint" id="smHint" style="margin:0"></p>
      <div id="smWeekBox" class="streakopts">
        <div class="mode" role="group">
          <button type="button" data-srule="hours" id="sr-hours" data-t="srHours"></button>
          <button type="button" data-srule="days" id="sr-days" data-t="srDays"></button>
        </div>
        <div class="streakset" id="srHoursBox"><label for="streakWeekH" data-t="srHoursL"></label><input type="number" id="streakWeekH" min="1" step="1" class="mono nospin" inputmode="decimal"><span class="hint" data-t="hoursU"></span></div>
        <div class="streakset" id="srDaysBox"><label for="streakWeekDays" data-t="srDaysL"></label><input type="number" id="streakWeekDays" min="1" max="7" step="1" class="mono nospin" inputmode="numeric"><span class="hint" data-t="srDaysOf7"></span></div>
      </div>
      <div class="streakset" id="smDayBox">
        <label for="streakMin" data-t="srDayMin"></label>
        <input type="number" id="streakMin" min="0.25" step="0.25" class="mono nospin" inputmode="decimal">
        <span class="hint" data-t="streakRule2"></span>
      </div>
    </div>
  </section>
  </div>
</dialog>
